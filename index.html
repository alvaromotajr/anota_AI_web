<html lang="pt-BR" data-tema="moderno">
<head>
<meta charset="utf-8">

<style>
/* ===== temas (os mesmos estilos do app: Config. > Layout) ===== */
:root{--bg:#F4F6FA;--card:#fff;--tx:#0F172A;--tx2:#64748B;--lin:#E3E8F1;--sv:#EDF1F7;--pri:#2563EB;--onpri:#fff;--topo:#F4F6FA;--topotx:#0F172A;--dest:#2563EB;--raio:24px;--borda:1px solid #E3E8F1;--sombra:none;--ok:#15803D;--mal:#B91C1C;--amb:#B45309;--aviso-ok:#DCFCE7;--aviso-okt:#14532D;--aviso-mal:#FEE2E2;--aviso-malt:#7F1D1D;--aviso-amb:#FEF3C7;--aviso-ambt:#78350F}
[data-tema=original]{--bg:#F1F5F4;--tx:#16201F;--tx2:#485956;--lin:#D5E2DF;--sv:#E3ECEA;--pri:#0F766E;--topo:#0F766E;--topotx:#fff;--dest:#5EEAD4;--raio:16px;--borda:none;--sombra:0 1px 3px #0002}
[data-tema=roxo]{--bg:#E3EAF3;--tx:#1E1530;--tx2:#4B4560;--lin:#D3DAE6;--sv:#E2E8F2;--pri:#4A1A6B;--topo:#4A1A6B;--topotx:#fff;--dest:#FFB300;--raio:20px;--borda:none;--sombra:0 1px 2px #0002}
[data-tema=escuro]{--bg:#000;--card:#161616;--tx:#F2F2F2;--tx2:#A8A8A8;--lin:#2E2E2E;--sv:#242424;--pri:#C8F169;--onpri:#101800;--topo:#000;--topotx:#F2F2F2;--dest:#C8F169;--raio:20px;--borda:1px solid #2E2E2E;--ok:#4ADE80;--mal:#FF8A80;--amb:#FBBF24;--aviso-ok:#14301F;--aviso-okt:#86EFAC;--aviso-mal:#3B1414;--aviso-malt:#FCA5A5;--aviso-amb:#3A2A0A;--aviso-ambt:#FCD34D}
[data-tema=suave]{--bg:#E4EEF1;--card:#F6FAFB;--tx:#1F3A40;--tx2:#4E6A70;--lin:#C9DBE0;--sv:#D9E6EA;--pri:#0E9AA7;--topo:#E4EEF1;--topotx:#1F3A40;--dest:#0E9AA7;--raio:26px;--borda:none;--sombra:0 3px 10px #0001}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer}
/* ===== topo (site) ===== */
.topo{background:var(--topo);color:var(--topotx);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--lin)}
[data-tema=roxo] .topo,[data-tema=original] .topo{border-bottom:0}
.topo-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 18px calc(10px + 0px)}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px;white-space:nowrap}
.abas-topo{display:flex;gap:4px;flex:1}
.abas-topo button{border:0;background:none;color:inherit;opacity:.75;padding:9px 14px;border-radius:12px;font-weight:600;font-size:15px}
.abas-topo button:hover{opacity:1;background:#8881}
.abas-topo button.on{opacity:1;background:var(--dest);color:var(--onpri2,#fff)}
[data-tema=roxo] .abas-topo button.on{color:#2A0A40}
[data-tema=escuro] .abas-topo button.on,[data-tema=moderno] .abas-topo button.on{color:var(--onpri)}
[data-tema=suave] .abas-topo button.on,[data-tema=original] .abas-topo button.on{color:#fff}
[data-tema=original] .abas-topo button.on{color:#042F2E}
.acoes{display:flex;align-items:center;gap:8px;margin-left:auto}
.btn-lancar{background:var(--dest);color:#fff;border:0;border-radius:14px;padding:9px 16px;font-weight:700}
[data-tema=roxo] .btn-lancar{color:#2A0A40}[data-tema=escuro] .btn-lancar{color:#101800}[data-tema=original] .btn-lancar{color:#042F2E}
.usr{font-size:13px;opacity:.8;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{border:1px solid #8884;background:transparent;color:inherit;border-radius:10px;padding:7px 10px;font-size:13px}

select.mini option{color:#111;background:#fff}
/* ===== página ===== */
.pag{max-width:1180px;margin:0 auto;padding:18px 18px 110px}
.pag.estreita{max-width:900px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:0 18px;align-items:start}
.grid2>div{min-width:0}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:0 14px;align-items:start}
.grid-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:0 14px}
@media(min-width:980px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--card);border-radius:var(--raio);border:var(--borda);box-shadow:var(--sombra);padding:16px;margin:0 0 12px}
.card.clic{cursor:pointer}.card.clic:hover{outline:2px solid var(--pri);outline-offset:-2px}

.cab i{font-style:normal;font-size:32px;line-height:1}
.vg small{color:var(--tx2);font-size:.5em;font-weight:500}.vg b{font-weight:800}
.mut{color:var(--tx2);font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--mal)}.amb{color:var(--amb)}
.sp{height:8px}
.titulo{font-size:18px;font-weight:800;margin:6px 0 10px}
.faixa{display:flex;justify-content:space-between;align-items:center;background:var(--sv);border-radius:12px;padding:8px 12px;margin:14px 0 8px;font-weight:800;font-size:13px;letter-spacing:.4px;text-transform:uppercase}

.lin:first-child,.cab+.lin{border-top:0}

.lin .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.v{font-weight:700;white-space:nowrap}
.clic-lin{cursor:pointer}.clic-lin:hover{background:#8881}
.bola{width:24px;height:24px;border-radius:50%;border:2px solid var(--tx2);flex:none;background:none;padding:0}

.mes{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 14px}
.mes button{border:0;background:var(--card);color:var(--pri);font-size:18px;width:44px;height:40px;border-radius:12px;border:var(--borda)}
.mes b{font-size:20px;min-width:200px;text-align:center}
.barra{display:flex;height:10px;background:var(--sv);border-radius:6px;overflow:hidden;margin:12px 0 10px}

.leg{display:flex;gap:10px}.leg>div{flex:1;min-width:0}

.lim{height:8px;background:#8883;border-radius:4px;overflow:hidden;margin-top:8px}

.aviso{border-radius:14px;padding:11px 13px;margin:0 0 10px;font-weight:700;font-size:14px}
.aviso.ok{background:var(--aviso-ok);color:var(--aviso-okt)}.aviso.mal{background:var(--aviso-mal);color:var(--aviso-malt)}.aviso.amb{background:var(--aviso-amb);color:var(--aviso-ambt)}
.aviso.clic{cursor:pointer}

.btn.txt{background:none;color:var(--pri);padding:8px;font-weight:700;width:auto;display:inline-block}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* ===== barra de baixo e botão + (celular) ===== */
.baixo{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--lin);justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:12}

.baixo button span{display:block;font-size:21px}
.baixo button.on{color:var(--pri);font-weight:700;background:var(--sv)}
.fab{display:none;position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--dest);color:#fff;font-size:30px;font-weight:700;box-shadow:0 4px 12px #0004;z-index:13}
[data-tema=roxo] .fab{color:#2A0A40}[data-tema=escuro] .fab{color:#101800}[data-tema=original] .fab{color:#042F2E}

 .abas-topo,.usr,.btn-lancar{display:none}

}
/* ===== janelas ===== */
.dlg{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg .box{background:var(--card);color:var(--tx);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px;padding:20px}
@media(max-width:820px){.dlg{align-items:flex-end;padding:0}.dlg .box{border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}}
.dlg h2{margin:0 0 10px;font-size:20px}
label{display:block;font-size:13px;color:var(--tx2);margin:10px 0 3px}
input,select{width:100%;padding:12px;border:1.5px solid var(--lin);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
.tabs{display:flex;gap:6px;margin:0 0 6px;overflow:auto}
.tabs button{flex:1;white-space:nowrap;border:1.5px solid var(--lin);background:none;color:var(--tx);border-radius:12px;padding:9px 8px;font-size:14px}
.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.erro{color:var(--mal);font-size:14px;margin-top:8px;min-height:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#1B1327;color:#fff;border-radius:14px;padding:12px 16px;z-index:40;display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{background:none;border:0;color:#FFB300;font-weight:700;font-size:15px}
/* ===== entrada ===== */
.entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.ent-box{display:grid;grid-template-columns:1fr 1fr;max-width:900px;width:100%;background:var(--card);border-radius:28px;overflow:hidden;border:var(--borda);box-shadow:0 10px 40px #0002}
.ent-marca{background:linear-gradient(150deg,#4A1A6B,#6B2D93);color:#fff;padding:40px 32px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ent-marca .big{font-size:64px}.ent-marca h1{margin:0;font-size:32px;text-transform:uppercase;letter-spacing:.5px}
.ent-marca p{margin:0;opacity:.9}.ent-marca ul{margin:10px 0 0;padding-left:18px;opacity:.9;line-height:1.7}
.ent-form{padding:36px 32px}
.ent-form h2{margin:0 0 4px;font-size:22px}
.ent-form .g{background:#fff;color:#1f1f1f;border:1.5px solid #DADCE0;border-radius:14px;padding:12px;width:100%;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.ou{display:flex;align-items:center;gap:10px;color:var(--tx2);font-size:13px;margin:16px 0 4px}.ou:before,.ou:after{content:"";flex:1;height:1px;background:var(--lin)}
.links{display:flex;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.links button{background:none;border:0;color:var(--pri);font-weight:600;padding:4px 0;font-size:14px}
.ok-msg{color:var(--ok);font-size:14px;margin-top:8px}
@media(max-width:720px){.ent-box{grid-template-columns:1fr}.ent-marca{padding:24px}.ent-marca .big{font-size:44px}.ent-marca ul{display:none}.ent-form{padding:24px 20px}}
.centro{text-align:center;padding:60px 20px;max-width:520px;margin:0 auto}
.centro h1{font-size:26px;margin:10px 0}
.fab{width:auto!important;height:54px!important;border-radius:27px!important;padding:0 20px;font-size:16px!important;white-space:nowrap}
.menu-it{padding:14px 4px}.menu-it .em{font-size:24px;width:36px;text-align:center;flex:none}
.tit-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.btn.txt:hover{background:#8881}
.baixo button{padding:6px 0;font-size:11px}
</style>
</head>
<body>
<div id="app"><div class="centro"><p class="mut">Carregando…</p></div></div>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut,
  signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc, arrayUnion, runTransaction } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $app = document.getElementById('app');
const LEGADOS = ['alvaromotajr@gmail.com', 'vivinati1996@gmail.com'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const GRUPOS_PADRAO = ['Salário (5º dia útil)', 'Adiantamento (dia 20)'];
const CORES_CARTAO = ['#111827', '#EA580C', '#2563EB', '#7C3AED'];
const ALERTA_SALDO = 100; // mesmo padrão do app (Config. > Lembretes)
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cent = v => Math.round(v * 100) / 100 + 0;
const money = v => cent(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const soma = (arr, f = x => x.valor) => arr.reduce((s, x) => s + f(x), 0);
const lsGet = (k, d = '') => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
// R$ pequeno, número grande, centavos pequenos (como no app)
const vg = (v, px, cor) => {
  const c = cent(v), a = Math.abs(c), i = Math.floor(a + 1e-9), ct = Math.round((a - i) * 100);
  return `<span class="vg"${cor ? ` style="color:${cor}"` : ''}><small>${c < 0 ? '-R$ ' : 'R$ '}</small><b style="font-size:${px}px">${i.toLocaleString('pt-BR')}</b><small>,${String(ct).padStart(2, '0')}</small></span>`;
};

// ---------- tema ----------
const TEMAS = [['moderno', 'Moderno'], ['original', 'Clássico'], ['roxo', 'Roxo e laranja'], ['escuro', 'Escuro'], ['suave', 'Suave']];
const COR_TOPO = { moderno: '#F4F6FA', original: '#0F766E', roxo: '#4A1A6B', escuro: '#000000', suave: '#E4EEF1' };
function aplicarTema(t) {
  if (!COR_TOPO[t]) t = 'moderno';
  document.documentElement.dataset.tema = t; lsSet('tema', t);
  document.querySelector('meta[name=theme-color]').content = COR_TOPO[t];
}
aplicarTema(lsGet('tema', 'moderno'));

if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('COLE')) {
  $app.innerHTML = '<div class="centro"><h1>⚙️ Falta configurar</h1><p>Abra o arquivo <b>firebase-config.js</b> e cole a configuração do app web do Firebase (LEIA-ME.md, passo 1).</p></div>';
  throw new Error('config');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- estado ----------
let user = null, fid = '';
const S = { lanc: [], cartoes: [], fixas: [], bancos: [], perfis: [], acoes: [], pend: 0, cfg: {} };
const carregou = new Set();
let aba = 'inicio', ym = ymOf(new Date()), ymFixado = false, cartaoSel = null, bancoSel = null, fatYm = 0, diaSel = null, unsubs = [];
let humorAtual = '', fraseAtual = '';

// ym como número: ano*12 + mês(0-11)
function ymOf(d) { return d.getFullYear() * 12 + d.getMonth(); }
const ymAno = n => Math.floor(n / 12), ymMes = n => ((n % 12) + 12) % 12;
const ymStr = n => `${ymAno(n)}-${String(ymMes(n) + 1).padStart(2, '0')}`;
const ymNome = n => `${MESES[ymMes(n)]} ${ymAno(n)}`;
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const diasNoMes = n => new Date(ymAno(n), ymMes(n) + 1, 0).getDate();
const diaDoMes = (n, d) => new Date(ymAno(n), ymMes(n), Math.min(Math.max(d, 1), diasNoMes(n)));
const dia = ms => new Date(ms);
const fdata = ms => ms ? new Date(ms).toLocaleDateString('pt-BR') : '';
const fdm = ms => { const d = new Date(ms); return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`; };
const hojeIni = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const iniDia = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const diffDias = (a, b) => Math.round((iniDia(a) - iniDia(b)) / 86400000);
function textoPrazo(venc) {
  const d = diffDias(venc.getTime(), Date.now());
  return d > 1 ? `vence em ${d} dias` : d === 1 ? 'vence amanhã' : d === 0 ? 'vence hoje' : d === -1 ? 'venceu ontem' : `venceu há ${-d} dias`;
}

// feriados nacionais + dia útil (igual ao app)
const _fer = {};
function feriados(ano) {
  if (_fer[ano]) return _fer[ano];
  const s = new Set([[1, 1], [4, 21], [5, 1], [9, 7], [10, 12], [11, 2], [11, 15], [12, 25]].map(([m, d]) => `${m}-${d}`));
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, dd = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
    g = Math.floor((b - f + 1) / 3), h = (19 * a + b - dd - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
    l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), d = (h + l - 7 * m + 114) % 31 + 1;
  const sexta = new Date(ano, mes - 1, d - 2); s.add(`${sexta.getMonth() + 1}-${sexta.getDate()}`);
  return _fer[ano] = s;

    return `<div class="card"><div class="cab"><b style="color:var(--tx);font-size:16px">👤 ${esc(n)}</b><b class="${cl(t)}" style="font-size:16px">${money(t)}</b></div>

}

// ---------- janelas ----------
let toastT = null;
function toast(msg, desfazer) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span>${esc(msg)}</span>${desfazer ? '<button>Desfazer</button>' : ''}`;
  document.body.appendChild(t);
  if (desfazer) t.querySelector('button').onclick = () => { desfazer(); t.remove(); };
  toastT = setTimeout(() => t.remove(), 9000);
}
function janela(html) {
  const d = document.createElement('div'); d.className = 'dlg';
  d.innerHTML = `<div class="box">${html}</div>`;
  d.addEventListener('mousedown', e => { if (e.target === d) { d.remove(); render(); } });
  document.body.appendChild(d); return d;
}
// ---------- ferramentas de formulário ----------
const pnum = s => { const t = String(s ?? '').replace('R$', '').trim(); if (!t) return NaN; return t.includes(',') ? parseFloat(t.replace(/\./g, '').replace(',', '.')) : parseFloat(t); };
const nstr = v => v ? String(cent(v)).replace('.', ',') : '';
const dstr = ms => { if (!ms) return ''; const d = new Date(ms); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

// Janela de formulário. campos(aba) devolve [{id,l,t,val,opts,dica,orig}]; t: t texto, n valor, i inteiro, d data, m mês, s lista, c caixa.
function form(o) {
  const d = janela(''), box = d.querySelector('.box');
  let aba0 = o.abaIni, memo = {};

  const ler = () => { const out = {}; for (const c of campos()) { const e = box.querySelector('#x_' + c.id); if (e) out[c.id] = c.t === 'c' ? e.checked : e.value; } return out; };
  const valores = () => {
    const raw = ler(), v = {};
    for (const c of campos()) {
      let x = raw[c.id]; if (x === undefined) continue;
      if (c.t === 'n') x = pnum(x); else if (c.t === 'i') x = parseInt(x) || 0; else if (c.t === 'd') x = dms(x, c.orig); else if (c.t === 't') x = x.trim();
      v[c.id] = x;

  };
  const html = c => {

    let inp;

    else if (c.t === 'd') inp = `<input id="${id}" type="date" value="${esc(val)}">`;
    else if (c.t === 'm') inp = `<input id="${id}" type="month" value="${esc(val)}">`;
    else inp = `<input id="${id}" ${c.t === 'n' ? 'inputmode="decimal"' : c.t === 'i' ? 'inputmode="numeric"' : ''} value="${esc(val)}" placeholder="${esc(c.ph || '')}">`;
    return `<label for="${id}">${esc(c.l)}</label>${inp}${c.dica ? `<div class="mut" style="margin-top:3px;font-size:12px">${esc(c.dica)}</div>` : ''}`;
  };

function dataParaFatura(c, alvo) {

}

// ---------- lançamentos (campos e montagem) ----------
function lanCampos(tipo, l = {}, o = {}) {
  const cats = comAtual(lista('categorias'), l.categoria), pess = comAtual(lista('pessoas'), l.paraQuem), grps = comAtual(lista('grupos'), l.grupo);
  const cartoes = comAtual(S.cartoes.filter(c => c.ativo !== false).map(c => c.nome), l.cartao);
  const bancos = [['', '—'], ...S.bancos.filter(b => b.ativa !== false || b.id === l.banco).map(b => [b.id, b.nome + (b.dono ? ` (${b.dono})` : '')])];
  const dono = { id: 'dono', l: 'De quem é (dono)', t: 's', opts: donosLista(l.dono), val: l.dono || meuNome() };
  const banco = { id: 'banco', l: 'Conta bancária', t: 's', opts: bancos, val: l.banco || '' };
  const data = lbl => ({ id: 'data', l: lbl, t: 'd', val: dstr(l.data || o.data || Date.now()), orig: l.data });
  const F = [{ id: 'valor', l: tipo === 'compra' && l.parcelas > 1 ? 'Valor total da compra (R$)' : 'Valor (R$)', t: 'n', val: nstr(l.valor) },
    { id: 'local', l: tipo === 'entrada' ? 'De onde veio' : 'Descrição / local', t: 't', val: l.local || '' }];
  if (tipo === 'compra') {
    F.push({ id: 'cartao', l: 'Cartão', t: 's', opts: cartoes, val: l.cartao || cartoes[0] },
      { id: 'parcelas', l: 'Parcelas (total)', t: 'i', val: l.parcelas || 1 });
    if (o.fatura) F.push({ id: 'atual', l: 'Parcela atual (nesta fatura)', t: 'i', val: 1, dica: 'Compra à vista: deixe 1. Se já estava em andamento, diga em qual parcela ela está nesta fatura.' });
    else F.push(data('Data'));
    F.push({ id: 'categoria', l: 'Categoria', t: 's', opts: cats, val: l.categoria || cats[0] }, { id: 'paraQuem', l: 'Para quem', t: 's', opts: opcoes(pess, '—'), val: l.paraQuem || '' });
  } else if (tipo === 'conta') {
    F.push(data('Vencimento'), { id: 'categoria', l: 'Categoria', t: 's', opts: cats, val: l.categoria || cats[0] }, banco, dono,
      { id: 'grupo', l: 'Pago com (grupo)', t: 's', opts: opcoes(grps, '—'), val: l.grupo || '' }, { id: 'pago', l: 'Já está paga', t: 'c', val: !!l.pago });
  } else if (tipo === 'saida') {
    F.push(data('Data'), { id: 'categoria', l: 'Categoria', t: 's', opts: cats, val: l.categoria || cats[0] }, { id: 'paraQuem', l: 'Para quem', t: 's', opts: opcoes(pess, '—'), val: l.paraQuem || '' }, banco, dono);
  } else if (tipo === 'entrada') {
    F.push(data('Data'), banco, dono, { id: 'grupo', l: 'Recebido para (grupo)', t: 's', opts: opcoes(grps, '—'), val: l.grupo || '' });
  } else if (tipo === 'fatura') {
    F.splice(1, 1); F.push(data('Data do pagamento'), banco, dono);
  }
  return F;
}
function lanDe(tipo, v, base = {}, o = {}) {
  if (!(v.valor > 0)) aviso('Digite o valor.');
  const l = { parcelas: 1, cartao: '', venc: 0, pago: false, categoria: '', paraQuem: '', banco: '', dono: '', grupo: '', ...base, id: base.id || novoId(), tipo, valor: cent(v.valor) };
  if (tipo !== 'fatura') l.local = v.local || (tipo === 'entrada' ? 'Entrada' : tipo === 'conta' ? 'Conta' : 'Lançamento');
  for (const k of ['categoria', 'paraQuem', 'banco', 'dono', 'grupo']) if (v[k] !== undefined) l[k] = v[k];
  if (tipo === 'compra') {
    const c = S.cartoes.find(x => x.nome === v.cartao); if (!c) aviso('Escolha o cartão.');
    l.cartao = c.nome; l.parcelas = Math.max(v.parcelas, 1); l.dono = base.dono || c.dono || meuNome();
    if (o.fatura) { const k = Math.max(v.atual || 1, 1); if (k > l.parcelas) aviso('A parcela atual não pode passar do total.'); l.data = dataParaFatura(c, o.fatura - (k - 1)); }
    else { if (!v.data) aviso('Escolha a data.'); l.data = v.data; }
  } else {
    if (!v.data) aviso('Escolha a data.');
    l.data = v.data; if (tipo === 'conta') { l.venc = v.data; l.pago = !!v.pago; }
  }
  return l;
}
// Novo lançamento (o.abas = tipos que podem ser trocados; o.banco / o.cartao pré-escolhidos).

function editarLanc(id) {
  const l = S.lanc.find(x => x.id === id); if (!l) return;
  const ext = [], tipo = l.tipo;
  const apagar = (t, msg) => ({ t, fn: async () => { if (!confirm('Apagar este lançamento?')) return false; await apagarLanc(l, msg); } });
  if (tipo === 'conta') {
    if (!l.pago) ext.push({ t: '✔ Paguei (com outro valor)', fn: async (v, t) => { const n = lanDe(t, v, l); n.pago = true; await gravarLanc(n); toast('Conta paga ✅'); } });

  form({
    titulo: nomes[tipo] || 'Editar lançamento', abaIni: tipo, campos: () => lanCampos(tipo, l), extras: ext,

  });
}
async function aplicarNosProximos(l, novo) {
  await gravarLanc(novo);
  const fx = l.id.slice(5, l.id.lastIndexOf('_')), f = S.fixas.find(x => x.id === fx); if (!f || f.parcelas > 0) return;
  const n0 = ymOf(dia(l.venc || l.data));
  const f2 = { ...f, valor: novo.valor, banco: novo.banco, dono: novo.dono, grupo: novo.grupo, categoria: novo.categoria };
  await salvarFixa(f2);
  for (const x of S.lanc) {
    if (!x.id.startsWith(`fixa_${f.id}_`) || x.pago || x.id === l.id) continue;
    const [a, m] = x.id.slice(x.id.lastIndexOf('_') + 1).split('-').map(Number), n = a * 12 + m - 1;
    if (n >= n0 && indiceEm(f2, n) !== null) await gravarLanc(lancDe(f2, n));
  }
}

  return { id: `fixa_${f.id}_${ymStr(n)}`, valor: valorEm(f, n), local: nomeEm(f, n), parcelas: 1, categoria: f.categoria || '', paraQuem: f.paraQuem || '',
    cartao: f.cartao || '', data: v, tipo: f.tipo, venc: f.tipo === 'conta' ? v : 0, pago: false, dono: f.dono || '', grupo: f.grupo || '', banco: f.banco || '' };
}
async function salvarFixa(f) {
  await setDoc(doc(col('fixas'), f.id), {
    nome: f.nome, valor: f.valor, dia: f.dia, tipo: f.tipo, categoria: f.categoria || '', paraQuem: f.paraQuem || '', dono: f.dono || '', cartao: f.cartao || '',
    ativa: f.ativa !== false, diaUtil: !!f.diaUtil, grupo: f.grupo || '', banco: f.banco || '', inicio: f.inicio || '', parcelas: f.parcelas || 0, valorTotal: f.valorTotal || 0,

async function receberFixa(id, valor, quando) {

  l.valor = valor ?? valorPrevisto(f, ym); l.data = quando || (l.data > hoje ? hoje : l.data);
  try { await gravarLanc(l); toast('Recebimento lançado ✅', () => deleteDoc(docLanc(l.id))); }
  catch (e) { toast('Não consegui: ' + (e.code || e.message)); }
}

async function reaplicar(f) {
  for (const l of S.lanc.filter(x => x.id.startsWith(`fixa_${f.id}_`) && !x.pago)) {
    if (f.ativa === false) { await deleteDoc(docLanc(l.id)); continue; }
    if (f.tipo !== 'conta') continue;
    const [a, m] = l.id.slice(l.id.lastIndexOf('_') + 1).split('-').map(Number), n = a * 12 + m - 1;
    if (indiceEm(f, n) === null) await deleteDoc(docLanc(l.id)); else await gravarLanc(lancDe(f, n));
  }

async function criarFaltando(f) {
  if (f.ativa === false || f.tipo !== 'conta') return;
  const atual = ymOf(new Date()), hoje = hojeIni();
  for (let i = 0; i < 12; i++) {
    const n = atual + i; if (indiceEm(f, n) === null || vencFixa(f, n) < hoje) continue;
    await criarSeNaoExiste(lancDe(f, n));
  }
}

let pediuPerfil = false;
function dlgPerfil(primeira) {
  const p = meuPerfil() || { nome: lsGet('nomeNovo', '') || cap(euMesmo().split('@')[0]), saldoInicial: 0, desde: Date.now() };
  form({
    titulo: primeira ? '👋 Bem-vindo(a)!' : '💰 Meu nome e saldo inicial', sub: primeira ? 'Como quer ser chamado(a)? O saldo inicial pode ficar zerado.' : 'Cada pessoa tem o seu saldo.',
    campos: () => [{ id: 'nome', l: 'Meu nome', t: 't', val: p.nome }, { id: 'saldo', l: 'Saldo inicial (R$)', t: 'n', val: nstr(p.saldoInicial) },
      { id: 'desde', l: 'O saldo vale a partir de', t: 'd', val: dstr(p.desde), orig: p.desde }],
    salvar: async v => {
      if (!v.nome) return 'Digite o seu nome.';
      await setDoc(doc(col('perfis'), euMesmo()), { nome: v.nome, saldoInicial: isNaN(v.saldo) ? 0 : cent(v.saldo), desde: v.desde || Date.now(), ...(meuPerfil() ? {} : { tutorial: true }) }, { merge: true });
      toast('Salvo ✅');
      if (primeira) { aba = 'config'; cfgSub = 'guia'; }
    }
  });
}
async function carregarFam() {
  if (!fid) return;
  try { const s = await getDoc(doc(db, 'familias', fid)); S.fam = s.exists() ? s.data() : { emails: [] }; } catch { S.fam = { emails: [] }; }
  render();
}

$app.addEventListener('click', e => {
  const b = e.target.closest('[data-recebi]'); if (b) { receberFixa(b.dataset.recebi); return; }
  const t = e.target.closest('[data-act]'); if (!t || e.target.closest('input')) return;
  const a = t.dataset.act, D = t.dataset;
  const cartao = () => S.cartoes.find(x => x.id === cartaoSel), banco = () => S.bancos.find(x => x.id === bancoSel);
  if (a === 'aba') { aba = D.aba; cartaoSel = null; bancoSel = null; diaSel = null; cfgSub = ''; render(); window.scrollTo(0, 0); }
  else if (a === 'mes') { ym += Number(D.d); diaSel = null; render(); }
  else if (a === 'fmes') { fatYm += Number(D.d); render(); }
  else if (a === 'cartao') { cartaoSel = D.id; aba = 'cartoes'; const c = S.cartoes.find(x => x.id === D.id); fatYm = D.ym ? Number(D.ym) : proximaFatura(c); render(); window.scrollTo(0, 0); }
  else if (a === 'banco') { bancoSel = D.id; render(); window.scrollTo(0, 0); }
  else if (a === 'voltar') { cartaoSel = null; bancoSel = null; render(); }
  else if (a === 'fab') abrirLancar();
  else if (a === 'cobrar') abrirCobrar();
  else if (a === 'dia') { diaSel = D.dia === '' ? null : Number(D.dia); render(); }
  else if (a === 'humor') { fraseAtual = sortear(FRASES[humorAtual] || FRASES.feliz); render(); }
  else if (a === 'edLanc') editarLanc(D.id);
  else if (a === 'menuRec') menuReceber(D.id);
  else if (a === 'fixas') gerenciarFixas();
  else if (a === 'perfil') dlgPerfil(false);
  else if (a === 'novoCartao') dlgCartao();
  else if (a === 'editCartao') dlgCartao(cartao());
  else if (a === 'novoBanco') dlgBanco();
  else if (a === 'editBanco') dlgBanco(banco());
  else if (a === 'pagFat') dlgPagarFatura(cartao(), fatYm, false);
  else if (a === 'pagParte') dlgPagarFatura(cartao(), fatYm, true);
  else if (a === 'desPag') { const pg = pagamento(cartao(), fatYm); if (pg && confirm('Desfazer o pagamento desta fatura?')) apagarLanc(pg, 'Pagamento desfeito'); }
  else if (a === 'csub') { cfgSub = D.s; if (cfgSub === 'familia') carregarFam(); render(); window.scrollTo(0, 0); }
  else if (a === 'tema') { aplicarTema(D.t); render(); }
  else if (a === 'lstAdd') { const v = (document.getElementById('lst_novo').value || '').trim(); if (v) salvarLista(D.k, [...lista(D.k), v]).catch(er => toast('Não consegui: ' + (er.code || er.message))); }
  else if (a === 'lstDel') { const l = lista(D.k); if (confirm(`Remover "${l[+D.i]}"?`)) salvarLista(D.k, l.filter((_, i) => i !== +D.i)); }
  else if (a === 'lstEd') { const l = lista(D.k), n = prompt('Novo nome:', l[+D.i]); if (n && n.trim()) salvarLista(D.k, l.map((x, i) => i === +D.i ? n.trim() : x)); }
  else if (a === 'copiar') { try { navigator.clipboard.writeText(D.t); toast('Código copiado ✅'); } catch { toast('Copie o código manualmente.'); } }
  else if (a === 'trocarFam') { if (confirm('Desconectar este navegador da família?')) trocarFamilia(); }
  else if (a === 'meta') {
    const r = prompt('Meta de sobra do mês (R$). Deixe vazio para sem meta. Vale só neste navegador.', lsGet('meta', '') || '');
    if (r !== null) { const n = pnum(r); lsSet('meta', isNaN(n) ? '0' : String(n)); render(); }
  }
  else if (a === 'zap') window.open('https://wa.me/?text=' + encodeURIComponent(textoConvite()), '_blank');
  else if (a === 'sair') signOut(auth);
});
$app.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'tema') { aplicarTema(t.value); render(); return; }
  if (t.dataset.baixa) {
    const l = S.lanc.find(x => x.id === t.dataset.baixa); if (!l) return;
    try { await updateDoc(docLanc(l.id), { pago: t.checked, por: euMesmo(), em: Date.now() }); }
    catch (er) { t.checked = !t.checked; toast('Não consegui: ' + (er.code || er.message)); }
  }
});

      <div class="ou">ou com e-mail e senha</div>
      ${criar ? '<label for="nm">Seu nome</label><input id="nm" autocomplete="name">' : ''}
      <label for="em">E-mail</label><input id="em" type="email" autocomplete="username" inputmode="email" value="${esc(lsGet('ultimoEmail'))}">

      <div class="erro" id="erro">${esc(msg)}</div><div class="ok-msg" id="okm">${esc(ok)}</div>

  E('modo').onclick = () => telaLogin('', '', criar ? 'entrar' : 'criar');

  E('form').onsubmit = async ev => {

// ---------- famílias ----------
const chaveFam = () => 'familia:' + euMesmo();
async function guardarFamilia(codigo) {
  lsSet(chaveFam(), codigo);
  try { await setDoc(doc(db, 'usuarios', euMesmo()), { familia: codigo }); } catch {}
  iniciar();
}
async function trocarFamilia() {
  try { await deleteDoc(doc(db, 'usuarios', euMesmo())); } catch {}
  lsSet(chaveFam(), ''); location.reload();
}
function novoCodigo() {
  const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(10));
  return [...r].map(x => letras[x % letras.length]).join('');
}
async function criarFamilia(modelo, nome) {
  const email = euMesmo(), codigo = novoCodigo();
  await setDoc(doc(db, 'familias', codigo), { emails: [email], criadoEm: Date.now() });
  fid = codigo;
  const pessoas = modelo === 'so' ? [nome] : modelo === 'casal' ? [nome, 'Cônjuge', 'Filhos'] : [nome, 'Cônjuge', 'Filhos', 'Outros'];
  const rendas = modelo === 'so' ? ['Salário', 'Extras'] : modelo === 'casal' ? ['Salário 1', 'Salário 2', 'Extras'] : ['Salário', 'Extras', 'Vale transporte', 'Adiantamento (dia 20)'];
  for (const [k, itens] of [['categorias', DEF_CATS], ['pessoas', pessoas], ['rendas', rendas], ['grupos', GRUPOS_PADRAO]]) await salvarLista(k, itens);
  await setDoc(doc(col('perfis'), email), { nome, saldoInicial: 0, desde: Date.now(), tutorial: true });
  await guardarFamilia(codigo);
}
async function entrarFamilia(texto) {
  const codigo = texto.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (codigo.length !== 10) throw Object.assign(new Error('O código tem 10 letras e números.'), { aviso: true });
  const ref = doc(db, 'familias', codigo), s = await getDoc(ref);
  if (!s.exists()) throw Object.assign(new Error('Não achei essa família. Confira o código.'), { aviso: true });
  await updateDoc(ref, { emails: arrayUnion(euMesmo()) });
  await guardarFamilia(codigo);
}
function telaFamilia() {
  pronto = false;
  const nomeIni = lsGet('nomeNovo', '') || cap(euMesmo().split('@')[0]);
  $app.innerHTML = `<div class="entrada"><div class="ent-box" style="grid-template-columns:1fr;max-width:620px"><div class="ent-form">
    <h2>Sua família no Anota Aí!</h2><p class="mut" style="margin:0 0 12px">Cada família tem as suas contas, cartões e bancos, separados de todas as outras. Entrou como <b>${esc(euMesmo())}</b>.</p>
    <div class="card"><b>🆕 Criar uma família nova</b>
      <label for="nm">Como quer ser chamado(a)?</label><input id="nm" value="${esc(nomeIni)}">
      <label for="md">Quem vai usar?</label><select id="md"><option value="so">Só eu</option><option value="casal">Eu e meu cônjuge</option><option value="familia">Família com filhos</option></select>
      <button class="btn" id="criar" style="margin-top:12px">Criar minha família</button></div>
    <div class="card"><b>🔑 Já tenho um código</b><p class="mut" style="margin:4px 0">Alguém da família te passou o código (em Config. > Minha família).</p>

      <button class="btn sec" id="entrar" style="margin-top:10px">Entrar na família</button></div>
    <div class="erro" id="e"></div><button class="btn txt" id="sair">Sair</button></div></div></div>`;
  const E = id => document.getElementById(id), trava = (b, on) => { E('criar').disabled = E('entrar').disabled = on; };
  const rodar = async fn => { E('e').textContent = ''; trava(0, true); try { await fn(); } catch (er) { trava(0, false); E('e').textContent = er.aviso ? er.message : 'Não consegui: ' + (er.code || er.message); } };
  E('sair').onclick = () => signOut(auth);
  E('criar').onclick = () => rodar(async () => { const n = E('nm').value.trim(); if (!n) throw Object.assign(new Error('Digite o seu nome.'), { aviso: true }); lsSet('nomeNovo', n); await criarFamilia(E('md').value, n); });
  E('entrar').onclick = () => rodar(() => entrarFamilia(E('cod').value));
}
async function iniciar() {
  const email = euMesmo();
  if (LEGADOS.includes(email)) fid = '';
  else {
    fid = lsGet(chaveFam(), '');
    if (!fid) {
      try { const s = await getDoc(doc(db, 'usuarios', email)); fid = s.exists() ? (s.data().familia || '') : ''; if (fid) lsSet(chaveFam(), fid); } catch {}
    }
    if (!fid) { telaFamilia(); return; }
  }
  ymFixado = false; ym = ymOf(new Date()); cfgSub = ''; pediuPerfil = false; S.fam = null; pronto = true;
  render(); ouvir();
}
onAuthStateChanged(auth, u => {
  user = u;
  if (!u) { unsubs.forEach(x => x()); unsubs = []; pronto = false; telaLogin(); return; }
