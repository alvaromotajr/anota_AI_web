<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4A1A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anota Aí!">
<title>Anota Aí!</title>
<style>
:root{--roxo:#4A1A6B;--roxo2:#6B2D93;--ouro:#FFB300;--bg:#F1EEF6;--card:#fff;--tx:#1B1327;--tx2:#6B6478;--lin:#E3DDEE;--ok:#15803D;--mal:#DC2626;--amb:#B45309}
@media(prefers-color-scheme:dark){:root{--bg:#150F1D;--card:#221A2E;--tx:#F3EEFA;--tx2:#A99FBA;--lin:#372C47;--ok:#4ADE80;--mal:#F87171;--amb:#FBBF24}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{background:var(--roxo);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 26px 26px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:22px;letter-spacing:.5px;text-transform:uppercase}
header p{margin:2px 0 0;opacity:.85;font-size:14px}
header .sair{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));background:#ffffff22;border:0;color:#fff;border-radius:12px;padding:6px 10px;font-size:13px}
main{max-width:720px;margin:0 auto;padding:14px 14px 0}
.card{background:var(--card);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px #0001}
.card h3{margin:0 0 6px;font-size:15px;color:var(--tx2);font-weight:600}
.big{font-size:28px;font-weight:800}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--lin)}
.row:first-child{border-top:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small,.mut{color:var(--tx2);font-size:13px}
.v{font-weight:700;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--mal)}.amb{color:var(--amb)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--lin);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;border:0;background:none;color:var(--tx2);font-size:12px;padding:6px 0;border-radius:14px}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--roxo);font-weight:700;background:#FFB30033}
@media(prefers-color-scheme:dark){nav button.on{color:var(--ouro)}}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--ouro);color:#3b1a00;font-size:30px;font-weight:700;box-shadow:0 4px 12px #0004;z-index:7}
.mes{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.mes button{border:0;background:var(--card);color:var(--roxo);font-size:20px;width:44px;height:40px;border-radius:12px}
@media(prefers-color-scheme:dark){.mes button{color:var(--ouro)}}
.mes b{}
.barra{height:10px;background:var(--lin);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.barra i{display:block;height:100%;background:var(--ok)}
.barra i.al{background:var(--amb)}.barra i.es{background:var(--mal)}
.chip{display:inline-block;padding:3px 9px;border-radius:10px;font-size:12px;background:#FFB30033;color:var(--amb);margin-left:6px}
.chip.ok{background:#15803D22;color:var(--ok)}
button.pri{background:var(--roxo);color:#fff;border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:700;width:100%}
button.sec{background:none;border:1.5px solid var(--lin);color:var(--tx);border-radius:14px;padding:11px;font-size:15px}
.dlg{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.dlg .box{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.dlg h2{margin:0 0 10px;font-size:19px}
label{display:block;font-size:13px;color:var(--tx2);margin:10px 0 3px}
input,select{width:100%;padding:12px;border:1.5px solid var(--lin);border-radius:12px;background:var(--bg);color:var(--tx);font-size:16px}
.tabs{display:flex;gap:6px;margin:0 0 6px;overflow:auto}
.tabs button{flex:1;white-space:nowrap;border:1.5px solid var(--lin);background:none;color:var(--tx);border-radius:12px;padding:9px 8px;font-size:14px}
.tabs button.on{background:var(--roxo);color:#fff;border-color:var(--roxo)}
.erro{color:var(--mal);font-size:14px;margin-top:8px}
.toast{position:fixed;left:12px;right:12px;bottom:calc(150px + env(safe-area-inset-bottom));background:#1B1327;color:#fff;border-radius:14px;padding:12px 14px;z-index:30;display:flex;gap:10px;align-items:center;justify-content:space-between;max-width:700px;margin:0 auto}
.toast button{background:none;border:0;color:var(--ouro);font-weight:700;font-size:15px}
.centro{text-align:center;padding:40px 20px}
.centro h1{font-size:26px;margin:10px 0}
.chk{width:26px;height:26px;accent-color:var(--ok);flex:none}
</style>
</head>
<body>
<div id="app"><div class="centro"><p class="mut">Carregando…</p></div></div>
<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const $app = document.getElementById('app');
const LEGADOS = ['alvaromotajr@gmail.com', 'vivinati1996@gmail.com'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cent = v => Math.round(v * 100) / 100 + 0;
const money = v => cent(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('COLE')) {
  $app.innerHTML = '<div class="centro"><h1>⚙️ Falta configurar</h1><p>Abra o arquivo <b>firebase-config.js</b> e cole a configuração do app web do Firebase (LEIA-ME.md, passo 1).</p></div>';
  throw new Error('config');
}

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- estado ----------
let user = null, fid = '';
const S = { lanc: [], cartoes: [], fixas: [], bancos: [], perfis: [], pend: 0, cfg: {} };
let aba = 'inicio', ym = ymOf(new Date()), cartaoSel = null, bancoSel = null, fatYm = 0, unsubs = [];

// ym como número: ano*12 + mês(0-11)
function ymOf(d) { return d.getFullYear() * 12 + d.getMonth(); }
const ymAno = n => Math.floor(n / 12), ymMes = n => n % 12;
const ymStr = n => `${ymAno(n)}-${String(ymMes(n) + 1).padStart(2, '0')}`;
const ymNome = n => `${MESES[ymMes(n)]} ${ymAno(n)}`;
const diasNoMes = n => new Date(ymAno(n), ymMes(n) + 1, 0).getDate();
const diaDoMes = (n, d) => new Date(ymAno(n), ymMes(n), Math.min(Math.max(d, 1), diasNoMes(n)));
const dia = ms => new Date(ms);
const fdata = ms => ms ? new Date(ms).toLocaleDateString('pt-BR') : '';
const hojeIni = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const iniDia = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };

// ---------- caminhos ----------
const col = nome => fid ? collection(db, 'familias', fid, nome) : collection(db, nome);
const cfgDoc = nome => doc(col('config'), nome);
const cfgLista = (n, padrao = []) => (S.cfg[n] && S.cfg[n].length ? S.cfg[n] : padrao);

// ---------- regras do app (iguais às do app Android) ----------
let alias = {};
function registrarApelidos() {
  const nomes = new Set(S.cartoes.map(c => c.nome.trim().toLowerCase()));
  alias = {};
  for (const c of S.cartoes) for (const a of (c.apelidos || '').split(',').map(x => x.trim()).filter(Boolean)) {
    if (!nomes.has(a.toLowerCase())) alias[a.toLowerCase()] = c.nome.trim();
  }
}
const canon = n => alias[(n || '').trim().toLowerCase()] || (n || '').trim();
const mesmo = (a, b) => canon(a).toLowerCase() === canon(b).toLowerCase();

function faturaDe(c, d) {
  const y = ymOf(d);
  const fech = Math.min(Math.max(c.fechamento, 1), diasNoMes(y));
  const fechou = d.getDate() < fech ? y : y + 1;
  return c.vencimento > c.fechamento ? fechou : fechou + 1;
}
function itensFatura(c, n) {
  const out = [];
  for (const l of S.lanc) {
    if (l.tipo !== 'compra' || !mesmo(l.cartao, c.nome)) continue;
    const k = n - faturaDe(c, dia(l.data));
    const np = Math.max(l.parcelas || 1, 1);
    if (k >= 0 && k < np) out.push({ l, parcela: k + 1, valor: np > 1 ? l.valor / np : l.valor });
  }
  return out.sort((a, b) => b.l.data - a.l.data);
}
const totalItens = it => it.reduce((s, i) => s + i.valor, 0);
const terceiro = (c, l) => c.titular && l.paraQuem && !mesmo(l.paraQuem, c.titular);
const cobrOk = (l, n) => (S.cfg.cobrancasOk || []).includes(`${l.id}|${ymStr(n)}`);
const terceirosPend = (c, n, it) => it.filter(i => terceiro(c, i.l) && !cobrOk(i.l, n)).reduce((s, i) => s + i.valor, 0);
const idPago = (c, n) => `fatura_${c.id}_${ymStr(n)}`;
const parciais = (c, n) => S.lanc.filter(l => l.id.startsWith(`fatparc_${c.id}_${ymStr(n)}_`)).sort((a, b) => a.data - b.data);
const adiantado = (c, n) => cent(parciais(c, n).reduce((s, l) => s + l.valor, 0));
const pagamento = (c, n) => S.lanc.find(l => l.id === idPago(c, n)) ||
  S.lanc.find(l => l.tipo === 'fatura' && !l.id.startsWith('fatparc_') && mesmo(l.cartao, c.nome) && ymOf(dia(l.data)) === n);
const nossaFalta = (c, n, it, adi) => cent(Math.max(totalItens(it) - terceirosPend(c, n, it) - adi, 0));
const vencFatura = (c, n) => diaDoMes(n, c.vencimento);
function proximaFatura(c) {
  const base = ymOf(new Date()), hoje = hojeIni();
  const desde = c.desde > 0 ? iniDia(c.desde) : -Infinity;
  for (let i = -1; i <= 3; i++) {
    const n = base + i, v = vencFatura(c, n);
    if (v.getTime() < desde) continue;
    if (pagamento(c, n)) continue;
    if (v < hoje && itensFatura(c, n).length === 0) continue;
    return n;
  }
  return base;
}

const mesDe = l => (l.tipo === 'conta' && l.venc > 0) ? l.venc : l.data;
function calcularContas(n) {
  const virt = S.cartoes.filter(c => c.ativo !== false).map(c => {
    const it = itensFatura(c, n), tot = totalItens(it), terc = terceirosPend(c, n, it);
    const pg = pagamento(c, n), adi = adiantado(c, n);
    if (tot <= 0 && !pg && adi <= 0) return null;
    return {
      id: idPago(c, n), virtual: true, cartaoObj: c,
      valor: pg ? pg.valor + adi : nossaFalta(c, n, it, adi),
      local: `💳 Fatura ${c.nome}` + (terc > 0 && !pg ? ' (nossa parte)' : '') + (adi > 0 && !pg ? ` • já pagou ${money(adi)}` : ''),
      tipo: 'conta', venc: vencFatura(c, n).getTime(), data: vencFatura(c, n).getTime(), pago: !!pg, dono: c.dono, grupo: c.grupo || ''
    };
  }).filter(Boolean);
  const reais = S.lanc.filter(l => l.tipo === 'conta' && ymOf(dia(mesDe(l))) === n);
  const contas = [...reais, ...virt].sort((a, b) => mesDe(a) - mesDe(b));
  const ids = new Set(S.lanc.map(l => l.id));
  const aReceber = S.fixas.filter(f => f.ativa !== false && f.tipo === 'entrada' && !ids.has(`fixa_${f.id}_${ymStr(n)}`) && fixaVale(f, n))
    .map(f => ({ ...f, valor: valorPrevisto(f, n) }));
  return { contas, aReceber };
}
function fixaVale(f, n) {
  const ini = f.inicio ? (() => { const [a, m] = f.inicio.split('-').map(Number); return a * 12 + m - 1; })() : null;
  const k = ini === null ? 0 : n - ini;
  if (ini !== null && k < 0) return false;
  if (f.parcelas > 0 && (ini === null || k >= f.parcelas)) return false;
  return true;
}
function valorPrevisto(f, n) {
  const e = (S.cfg.previstos || []).find(x => x.startsWith(`${f.id}|${ymStr(n)}|`));
  const v = e ? parseFloat(e.split('|').pop()) : NaN;
  return isNaN(v) ? f.valor : v;
}
function saldoDe(p) {
  let s = p.saldoInicial || 0; const hoje = hojeIni().getTime() + 86400000;
  for (const l of S.lanc) {
    if (l.dono !== p.nome || iniDia(l.data) < iniDia(p.desde || 0)) continue;
    if (l.tipo !== 'conta' && l.data >= hoje) continue;
    if (l.tipo === 'entrada') s += l.valor;
    else if (l.tipo === 'saida' || l.tipo === 'fatura') s -= l.valor;
    else if (l.tipo === 'conta' && l.pago && !(l.banco || '').startsWith('cc:')) s -= l.valor;
  }
  return cent(s);
}
function saldoBanco(b) {
  let s = b.saldoInicial || 0; const hoje = hojeIni().getTime() + 86400000;
  for (const l of S.lanc) {
    if (l.banco !== b.id || iniDia(l.data) < iniDia(b.desde || 0)) continue;
    if (l.tipo !== 'conta' && l.data >= hoje) continue;
    if (l.tipo === 'entrada') s += l.valor;
    else if (l.tipo === 'saida' || l.tipo === 'fatura') s -= l.valor;
    else if (l.tipo === 'conta' && l.pago && !(l.banco || '').startsWith('cc:')) s -= l.valor;
  }
  return cent(s);
}
function aCobrar() {
  const base = ymOf(new Date()), out = [];
  for (const c of S.cartoes) {
    if (c.ativo === false || !c.titular) continue;
    let lim = proximaFatura(c); if (lim < base) lim = base;
    for (let i = -6; i <= 3; i++) {
      const n = base + i; if (n > lim) continue;
      for (const it of itensFatura(c, n)) if (terceiro(c, it.l) && !cobrOk(it.l, n)) out.push({ c, n, it });
    }
  }
  return out;
}
const meuPerfil = () => S.perfis.find(p => p.email === (user?.email || '').toLowerCase());
const meuNome = () => meuPerfil()?.nome || (user?.email || '').split('@')[0];

// ---------- gravação ----------
const lanMap = l => ({
  valor: l.valor, local: l.local, parcelas: l.parcelas ?? 1, categoria: l.categoria || '', paraQuem: l.paraQuem || '',
  cartao: l.cartao || '', data: l.data, tipo: l.tipo, venc: l.venc || 0, pago: !!l.pago, dono: l.dono || '', grupo: l.grupo || '',
  banco: l.banco || '', auto: false, serie: '', serieIni: 1, serieTotal: 0,
  por: (user?.email || '').toLowerCase(), em: Date.now()
});
const novoId = () => 'web_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// ---------- carregar dados ----------
function ouvir() {
  unsubs.forEach(u => u()); unsubs = [];
  const mapa = (nome, alvo, fn) => unsubs.push(onSnapshot(col(nome), snap => { S[alvo] = snap.docs.map(fn); render(); }, e => erroDados(e)));
  mapa('lancamentos', 'lanc', d => { const x = d.data(); return { id: d.id, valor: x.valor || 0, local: x.local || '', parcelas: x.parcelas || 1, categoria: x.categoria || '', paraQuem: x.paraQuem || '', cartao: x.cartao || '', data: x.data || 0, tipo: x.tipo || 'compra', venc: x.venc || 0, pago: !!x.pago, dono: x.dono || '', grupo: x.grupo || '', banco: x.banco || '' }; });
  mapa('cartoes', 'cartoes', d => { const x = d.data(); return { id: d.id, nome: x.nome || '', fechamento: x.fechamento || 1, vencimento: x.vencimento || 10, dono: x.dono || '', ativo: x.ativo !== false, desde: x.desde || 0, grupo: x.grupo || '', titular: x.titular || '', limite: x.limite || 0, apelidos: x.apelidos || '' }; });
  mapa('fixas', 'fixas', d => ({ id: d.id, ...d.data() }));
  mapa('bancos', 'bancos', d => { const x = d.data(); return { id: d.id, nome: x.nome || '', saldoInicial: x.saldoInicial || 0, desde: x.desde || 0, dono: x.dono || '', ativa: x.ativa !== false }; });
  mapa('perfis', 'perfis', d => { const x = d.data(); return { email: d.id.toLowerCase(), nome: x.nome || '', saldoInicial: x.saldoInicial || 0, desde: x.desde || 0 }; });
  unsubs.push(onSnapshot(col('pendentes'), s => { S.pend = s.size; render(); }, () => {}));
  for (const nome of ['categorias', 'pessoas', 'rendas', 'grupos', 'previstos', 'cobrancasOk']) {
    unsubs.push(onSnapshot(cfgDoc(nome), s => { S.cfg[nome] = (s.data()?.itens || []).map(String); render(); }, () => {}));
  }
}
function erroDados(e) {
  $app.innerHTML = `<div class="centro"><h1>😕 Sem acesso</h1><p>${esc(e.code || e.message)}</p><p class="mut">Confira se você entrou com o e-mail da família${fid ? ' e se o código da família está certo' : ''}.</p><button class="sec" id="trocar">Trocar código da família</button> <button class="sec" id="sair">Sair</button></div>`;
  document.getElementById('sair').onclick = () => signOut(auth);
  document.getElementById('trocar').onclick = () => { localStorage.removeItem('familia'); location.reload(); };
}

// ---------- telas ----------
const header = (t, s) => `<header><h1>${esc(t)}</h1><p>${esc(s)}</p><button class="sair" id="sair">Sair</button></header>`;
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const navMes = (rot) => `<div class="mes"><button data-mes="-1">◀</button><b>${esc(rot || cap(ymNome(ym)))}</b><button data-mes="1">▶</button></div>`;
const cl = v => v < 0 ? 'neg' : 'pos';

function telaInicio() {
  const { contas, aReceber } = calcularContas(ym);
  const falta = cent(contas.filter(c => !c.pago).reduce((s, c) => s + c.valor, 0));
  const pago = cent(contas.filter(c => c.pago).reduce((s, c) => s + c.valor, 0));
  const receber = cent(aReceber.reduce((s, f) => s + f.valor, 0));
  const entradasMes = S.lanc.filter(l => l.tipo === 'entrada' && ymOf(dia(l.data)) === ym);
  const grupos = cfgLista('grupos', ['Salário (5º dia útil)', 'Adiantamento (dia 20)']).map(g => {
    const cs = contas.filter(c => c.grupo === g), ar = aReceber.filter(f => f.grupo === g);
    const f = cs.filter(c => !c.pago).reduce((s, c) => s + c.valor, 0), a = ar.reduce((s, x) => s + x.valor, 0);
    const rec = a + entradasMes.filter(l => l.grupo === g).reduce((s, l) => s + l.valor, 0);
    return { g, contas: cs.reduce((s, c) => s + c.valor, 0), falta: f, aReceber: a, rec, sobra: cent(-(f - a)) };
  }).filter(x => x.rec > 0 || x.contas > 0);
  const cob = aCobrar();
  const totCob = cent(cob.reduce((s, x) => s + x.it.valor, 0));
  const perfis = [...S.perfis].sort((a, b) => (a.email === (user.email || '').toLowerCase() ? -1 : 0) - (b.email === (user.email || '').toLowerCase() ? -1 : 0));
  return `${header('Anota Aí!', `Olá, ${meuNome()}`)}<main>
  ${navMes()}
  <div class="card"><h3>Saldo de cada pessoa</h3>${perfis.length ? perfis.map(p => `<div class="row"><div class="t"><b>${esc(p.nome)}</b></div><div class="v ${cl(saldoDe(p))}">${money(saldoDe(p))}</div></div>`).join('') : '<p class="mut">Sem perfis.</p>'}</div>
  <div class="card"><h3>Contas de ${esc(ymNome(ym))}</h3>
    <div class="row"><div class="t">Falta pagar</div><div class="v amb">${money(falta)}</div></div>
    <div class="row"><div class="t">Já pago</div><div class="v pos">${money(pago)}</div></div>
    <div class="row"><div class="t">Ainda a receber</div><div class="v">${money(receber)}</div></div></div>
  ${grupos.map(x => `<div class="card"><h3>${esc(x.g)}</h3><div class="big ${x.sobra < 0 ? 'neg' : 'pos'}">${x.sobra < 0 ? 'Faltam ' + money(-x.sobra) : 'Sobram ' + money(x.sobra)}</div><span class="mut">Falta pagar ${money(x.falta)} • a receber ${money(x.aReceber)}</span></div>`).join('')}
  <div class="card"><h3>💸 A cobrar de terceiros</h3><div class="big amb">${money(totCob)}</div>
    ${[...new Set(cob.map(x => x.it.l.paraQuem))].map(p => `<div class="row"><div class="t">${esc(p)}</div><div class="v">${money(cob.filter(x => x.it.l.paraQuem === p).reduce((s, x) => s + x.it.valor, 0))}</div></div>`).join('')}</div>
  ${S.pend ? `<div class="card"><b>📥 ${S.pend} lançamento(s) em Pendentes</b><br><span class="mut">Confirme pelo app no celular.</span></div>` : ''}
  </main>`;
}

function telaContas() {
  const { contas, aReceber } = calcularContas(ym);
  const grupos = cfgLista('grupos', []);
  const blocos = [];
  for (const g of grupos) { const l = contas.filter(c => c.grupo === g); if (l.length) blocos.push([g, l]); }
  const resto = contas.filter(c => !grupos.includes(c.grupo)); if (resto.length) blocos.push([blocos.length ? 'Outras contas' : 'Contas e boletos', resto]);
  const hoje = hojeIni().getTime();
  return `${header('Contas', 'Contas do mês')}<main>${navMes()}
  ${blocos.map(([g, l]) => `<div class="card"><h3>${esc(g)} — falta ${money(l.filter(c => !c.pago).reduce((s, c) => s + c.valor, 0))}</h3>
    ${l.map(c => `<div class="row"><input type="checkbox" class="chk" ${c.pago ? 'checked' : ''} ${c.virtual ? 'disabled' : `data-baixa="${esc(c.id)}"`}>
      <div class="t"><b>${esc(c.local)}</b><small class="${!c.pago && mesDe(c) < hoje ? 'neg' : ''}">vence ${fdata(mesDe(c))}${!c.pago && mesDe(c) < hoje ? ' • atrasada' : ''}</small></div>
      <div class="v">${money(c.valor)}</div></div>`).join('')}</div>`).join('') || '<div class="card"><p class="mut">Nenhuma conta neste mês.</p></div>'}
  ${aReceber.length ? `<div class="card"><h3>A receber</h3>${aReceber.map(f => `<div class="row"><div class="t"><b>${esc(f.nome)}</b><small>${f.diaUtil ? f.dia + 'º dia útil' : 'dia ' + f.dia}</small></div><div class="v pos">${money(f.valor)}</div></div>`).join('')}</div>` : ''}
  <p class="mut">Faturas de cartão: marque como pagas pelo app. Aqui você consulta e dá baixa nas contas.</p></main>`;
}

function telaCartoes() {
  if (cartaoSel) return telaFatura(S.cartoes.find(c => c.id === cartaoSel));
  const hoje = ymOf(new Date());
  return `${header('Cartões', 'Faturas e compras no cartão')}<main>
  ${S.cartoes.filter(c => c.ativo !== false).map(c => {
    const n = proximaFatura(c), it = itensFatura(c, n), tot = totalItens(it);
    const pct = c.limite > 0 ? Math.round(tot / c.limite * 100) : 0;
    return `<div class="card" data-cartao="${esc(c.id)}"><div class="row"><div class="t"><b>💳 ${esc(c.nome)}</b><small>fatura de ${esc(ymNome(n))} • vence ${vencFatura(c, n).toLocaleDateString('pt-BR')}</small></div><div class="v">${money(tot)}</div></div>
    ${c.limite > 0 ? `<div class="barra"><i class="${pct >= 100 ? 'es' : pct >= 80 ? 'al' : ''}" style="width:${Math.min(pct, 100)}%"></i></div><small class="mut">${pct}% do limite de ${money(c.limite)}</small>` : ''}</div>`;
  }).join('') || '<div class="card"><p class="mut">Nenhum cartão cadastrado.</p></div>'}</main>`;
}
function telaFatura(c) {
  if (!c) { cartaoSel = null; return telaCartoes(); }
  const n = fatYm, it = itensFatura(c, n), tot = totalItens(it), terc = it.filter(i => terceiro(c, i.l)).reduce((s, i) => s + i.valor, 0);
  const pg = pagamento(c, n), adi = adiantado(c, n), ps = parciais(c, n);
  const pct = c.limite > 0 ? Math.round(tot / c.limite * 100) : 0;
  return `${header('💳 ' + c.nome, 'Fatura')}<main><button class="sec" id="voltar" style="margin-bottom:10px">← Cartões</button>
  <div class="mes"><button data-fmes="-1">◀</button><b>Fatura de ${esc(ymNome(n))}</b><button data-fmes="1">▶</button></div>
  <div class="card"><h3>Total da fatura</h3><div class="big">${money(tot)}</div>
    <div>Nossa parte: <b>${money(tot - terc)}</b></div>
    ${terc > 0 ? `<div class="amb">💸 De terceiros: <b>${money(terc)}</b></div>` : ''}
    ${c.limite > 0 ? `<div class="barra"><i class="${pct >= 100 ? 'es' : pct >= 80 ? 'al' : ''}" style="width:${Math.min(pct, 100)}%"></i></div><small class="mut">${pct}% do limite de ${money(c.limite)}</small>` : ''}
    <div style="margin-top:8px">Vencimento: <b>${vencFatura(c, n).toLocaleDateString('pt-BR')}</b> • fecha dia ${c.fechamento} ${pg ? '<span class="chip ok">✔ paga</span>' : '<span class="chip">em aberto</span>'}</div>
    ${adi > 0 && !pg ? `<div class="mut">Pago adiantado: ${money(adi)} (${ps.length}) • falta ${money(tot - adi)}</div>` : ''}</div>
  <div class="card"><h3>Compras (${it.length})</h3>${it.map(i => `<div class="row"><div class="t"><b>${esc(i.l.local)}</b><small>${fdata(i.l.data)}${i.l.parcelas > 1 ? ` • parcela ${i.parcela}/${i.l.parcelas}` : ''}${i.l.paraQuem ? ' • ' + esc(i.l.paraQuem) : ''}${terceiro(c, i.l) ? (cobrOk(i.l, n) ? ' • ✔ já pagou' : ' • 💸 cobrar') : ''}</small></div><div class="v">${money(i.valor)}</div></div>`).join('') || '<p class="mut">Sem compras nesta fatura.</p>'}</div></main>`;
}

function telaBancos() {
  if (bancoSel) {
    const b = S.bancos.find(x => x.id === bancoSel);
    if (!b) { bancoSel = null; return telaBancos(); }
    const ls = S.lanc.filter(l => l.banco === b.id).sort((a, z) => z.data - a.data).slice(0, 80);
    const sinal = l => (l.tipo === 'entrada') ? 1 : ((l.tipo === 'conta' && !l.pago) ? 0 : -1);
    return `${header('🏦 ' + b.nome, 'Extrato')}<main><button class="sec" id="voltar" style="margin-bottom:10px">← Bancos</button>
    <div class="card"><h3>Saldo</h3><div class="big ${cl(saldoBanco(b))}">${money(saldoBanco(b))}</div></div>
    <div class="card"><h3>Últimos lançamentos</h3>${ls.map(l => `<div class="row"><div class="t"><b>${esc(l.local || l.tipo)}</b><small>${fdata(l.data)} • ${esc(l.tipo)}${l.tipo === 'conta' && !l.pago ? ' • a pagar' : ''}</small></div><div class="v ${sinal(l) > 0 ? 'pos' : ''}">${sinal(l) > 0 ? '+' : sinal(l) < 0 ? '−' : ''}${money(l.valor)}</div></div>`).join('') || '<p class="mut">Sem lançamentos.</p>'}</div></main>`;
  }
  const donos = [...new Set(S.bancos.filter(b => b.ativa !== false).map(b => b.dono || 'Sem dono'))];
  return `${header('Bancos', 'Contas bancárias')}<main>${donos.map(d => {
    const bs = S.bancos.filter(b => b.ativa !== false && (b.dono || 'Sem dono') === d);
    return `<div class="card"><h3>${esc(d)} — ${money(bs.reduce((s, b) => s + saldoBanco(b), 0))}</h3>${bs.map(b => `<div class="row" data-banco="${esc(b.id)}"><div class="t"><b>🏦 ${esc(b.nome)}</b></div><div class="v ${cl(saldoBanco(b))}">${money(saldoBanco(b))}</div></div>`).join('')}</div>`;
  }).join('') || '<div class="card"><p class="mut">Nenhuma conta bancária.</p></div>'}</main>`;
}

// ---------- lançar ----------
let toastT = null;
function toast(msg, desfazer) {
  document.querySelector('.toast')?.remove(); clearTimeout(toastT);
  const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span>${esc(msg)}</span>${desfazer ? '<button>Desfazer</button>' : ''}`;
  document.body.appendChild(t);
  if (desfazer) t.querySelector('button').onclick = () => { desfazer(); t.remove(); };
  toastT = setTimeout(() => t.remove(), 9000);
}
function abrirLancar(tipoIni = 'compra') {
  let tipo = tipoIni;
  const d = document.createElement('div'); d.className = 'dlg';
  const hojeStr = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const opt = (arr, sel) => arr.map(x => `<option ${x === sel ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const cats = cfgLista('categorias', ['Mercado', 'Outros']), pess = cfgLista('pessoas', []), grps = cfgLista('grupos', []);
  const cartoes = S.cartoes.filter(c => c.ativo !== false), bancos = S.bancos.filter(b => b.ativa !== false);
  const donos = [...new Set([...S.perfis.map(p => p.nome), meuNome()])].filter(Boolean);
  const desenhar = () => {
    d.innerHTML = `<div class="box"><h2>Novo lançamento</h2>
    <div class="tabs">${[['compra', '💳 Cartão'], ['saida', '⬆️ Saída'], ['entrada', '⬇️ Entrada'], ['conta', '🧾 Boleto']].map(([k, n]) => `<button data-t="${k}" class="${k === tipo ? 'on' : ''}">${n}</button>`).join('')}</div>
    <label>Valor (R$)</label><input id="f_valor" inputmode="decimal" placeholder="0,00">
    <label>${tipo === 'entrada' ? 'De onde veio' : 'Descrição / local'}</label><input id="f_local">
    ${tipo === 'compra' ? `<label>Cartão</label><select id="f_cartao">${cartoes.map(c => `<option>${esc(c.nome)}</option>`).join('')}</select><label>Parcelas</label><input id="f_parc" inputmode="numeric" value="1">` : ''}
    <label>${tipo === 'conta' ? 'Vencimento' : 'Data'}</label><input id="f_data" type="date" value="${hojeStr}">
    ${tipo !== 'entrada' ? `<label>Categoria</label><select id="f_cat">${opt(cats)}</select>` : ''}
    ${tipo === 'compra' || tipo === 'saida' ? `<label>Para quem</label><select id="f_para"><option value="">—</option>${opt(pess)}</select>` : ''}
    ${tipo !== 'compra' ? `<label>Conta bancária</label><select id="f_banco"><option value="">—</option>${bancos.map(b => `<option value="${esc(b.id)}">${esc(b.nome)}${b.dono ? ' (' + esc(b.dono) + ')' : ''}</option>`).join('')}</select>` : ''}
    ${tipo !== 'compra' ? `<label>De quem é (dono)</label><select id="f_dono">${opt(donos, meuNome())}</select>` : ''}
    ${tipo === 'conta' || tipo === 'entrada' ? `<label>Pago/recebido com</label><select id="f_grupo"><option value="">—</option>${opt(grps)}</select>` : ''}
    ${tipo === 'conta' ? `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f_pago" style="width:22px;height:22px"> Já paguei</label>` : ''}
    <div class="erro" id="f_erro"></div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="sec" id="f_cancel" style="flex:1">Cancelar</button><button class="pri" id="f_ok" style="flex:2">Salvar</button></div></div>`;
    d.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tipo = b.dataset.t; desenhar(); });
    d.querySelector('#f_cancel').onclick = () => d.remove();
    d.querySelector('#f_ok').onclick = salvar;
  };
  const v = id => d.querySelector('#' + id)?.value ?? '';
  async function salvar() {
    const num = parseFloat(v('f_valor').replace(/\./g, '').replace(',', '.'));
    const err = d.querySelector('#f_erro');
    if (!(num > 0)) { err.textContent = 'Digite o valor.'; return; }
    if (!v('f_data')) { err.textContent = 'Escolha a data.'; return; }
    const [a, m, di] = v('f_data').split('-').map(Number);
    const agora = new Date(); const dt = new Date(a, m - 1, di, agora.getHours(), agora.getMinutes()).getTime();
    const l = { id: novoId(), valor: cent(num), local: v('f_local').trim() || (tipo === 'entrada' ? 'Entrada' : 'Lançamento'), tipo, data: dt, categoria: v('f_cat'), paraQuem: v('f_para') };
    if (tipo === 'compra') {
      const c = cartoes.find(x => x.nome === v('f_cartao'));
      if (!c) { err.textContent = 'Escolha o cartão.'; return; }
      l.cartao = c.nome; l.parcelas = Math.max(parseInt(v('f_parc')) || 1, 1); l.dono = c.dono || meuNome();
    } else {
      l.banco = v('f_banco'); l.dono = v('f_dono') || meuNome(); l.grupo = v('f_grupo');
      if (tipo === 'conta') { l.venc = dt; l.pago = d.querySelector('#f_pago').checked; }
    }
    try {
      await setDoc(doc(col('lancamentos'), l.id), lanMap(l));
      d.remove(); toast('Lançamento salvo ✅', () => deleteDoc(doc(col('lancamentos'), l.id)));
    } catch (e) { err.textContent = 'Não consegui salvar: ' + (e.code || e.message); }
  }
  desenhar(); document.body.appendChild(d);
}

// ---------- render ----------
function render() {
  if (!user || document.querySelector('.dlg')) { if (!user) return; }
  if (document.querySelector('.dlg')) return; // não redesenha por cima do formulário aberto
  let corpo;
  if (aba === 'inicio') corpo = telaInicio();
  else if (aba === 'contas') corpo = telaContas();
  else if (aba === 'cartoes') corpo = telaCartoes();
  else corpo = telaBancos();
  const y = window.scrollY;
  $app.innerHTML = corpo +
    `<button class="fab" id="fab" aria-label="Lançar">+</button>
     <nav>${[['inicio', '🏠', 'Início'], ['contas', '📅', 'Contas'], ['bancos', '🏦', 'Bancos'], ['cartoes', '💳', 'Cartões']].map(([k, i, n]) => `<button data-aba="${k}" class="${aba === k ? 'on' : ''}"><span>${i}</span>${n}</button>`).join('')}</nav>`;
  window.scrollTo(0, y);
  $app.querySelector('#sair').onclick = () => signOut(auth);
  $app.querySelector('#fab').onclick = () => abrirLancar();
  $app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; cartaoSel = null; bancoSel = null; render(); window.scrollTo(0, 0); });
  $app.querySelectorAll('[data-mes]').forEach(b => b.onclick = () => { ym += Number(b.dataset.mes); render(); });
  $app.querySelectorAll('[data-cartao]').forEach(b => b.onclick = () => { cartaoSel = b.dataset.cartao; fatYm = proximaFatura(S.cartoes.find(x => x.id === cartaoSel)); render(); window.scrollTo(0, 0); });
  $app.querySelectorAll('[data-banco]').forEach(b => b.onclick = () => { bancoSel = b.dataset.banco; render(); window.scrollTo(0, 0); });
  $app.querySelector('#voltar')?.addEventListener('click', () => { cartaoSel = null; bancoSel = null; render(); });
  $app.querySelectorAll('[data-fmes]').forEach(b => b.onclick = () => { fatYm += Number(b.dataset.fmes); render(); });
  $app.querySelectorAll('[data-baixa]').forEach(b => b.onchange = async () => {
    const l = S.lanc.find(x => x.id === b.dataset.baixa); if (!l) return;
    try { await updateDoc(doc(col('lancamentos'), l.id), { pago: b.checked, por: (user.email || '').toLowerCase(), em: Date.now() }); }
    catch (e) { b.checked = !b.checked; toast('Não consegui: ' + (e.code || e.message)); }
  });
}

// ---------- entrada ----------
function telaLogin(msg = '') {
  $app.innerHTML = `<div class="centro"><div style="font-size:56px">📒</div><h1>Anota Aí!</h1><p class="mut">Contas da família no navegador</p><button class="pri" id="entrar" style="max-width:320px;margin-top:14px">Entrar com Google</button><div class="erro">${esc(msg)}</div></div>`;
  document.getElementById('entrar').onclick = async () => {
    const p = new GoogleAuthProvider();
    try { await signInWithPopup(auth, p); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) signInWithRedirect(auth, p);
      else telaLogin(e.code === 'auth/unauthorized-domain' ? 'Este endereço ainda não foi autorizado no Firebase (LEIA-ME, passo 2).' : (e.code || e.message));
    }
  };
}
function pedirFamilia() {
  $app.innerHTML = `<div class="centro"><h1>Código da família</h1><p class="mut">Está em Config. do app (10 letras e números).</p><input id="cod" placeholder="XXXXX-XXXXX" style="max-width:280px;text-align:center;text-transform:uppercase"><br><br><button class="pri" id="ok" style="max-width:280px">Continuar</button> <br><br><button class="sec" id="sair">Sair</button><div class="erro" id="e"></div></div>`;
  document.getElementById('sair').onclick = () => signOut(auth);
  document.getElementById('ok').onclick = () => {
    const c = document.getElementById('cod').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length !== 10) { document.getElementById('e').textContent = 'O código tem 10 letras e números.'; return; }
    localStorage.setItem('familia', c); iniciar();
  };
}
function iniciar() {
  const email = (user.email || '').toLowerCase();
  fid = LEGADOS.includes(email) ? '' : (localStorage.getItem('familia') || '');
  if (!LEGADOS.includes(email) && !fid) { pedirFamilia(); return; }
  render(); ouvir();
}
onAuthStateChanged(auth, u => {
  user = u;
  if (!u) { unsubs.forEach(x => x()); unsubs = []; telaLogin(); return; }
  iniciar();
});
</script>
</body>
</html>
